name: Build and Deploy Go Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: |
          go mod download

      - name: Build Linux binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o backend .

      - name: Check binary
        run: |
          file backend
          ls -lh backend

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
        run: |
          set -e

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/azure_key"
          chmod 600 "$HOME/.ssh/azure_key"

          ssh-keyscan -H "$AZURE_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Test Azure SSH
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/azure_key" \
            "$AZURE_USER@$AZURE_HOST" \
            "hostname && whoami"

      - name: Upload binary to Azure
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          scp \
            -i "$HOME/.ssh/azure_key" \
            backend \
            "$AZURE_USER@$AZURE_HOST:/home/azureuser/backend-new"

      - name: Deploy application
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/azure_key" \
            "$AZURE_USER@$AZURE_HOST" \
            'sudo systemctl stop cometosee &&
             sudo mv /home/azureuser/backend-new /home/azureuser/backend &&
             sudo chmod +x /home/azureuser/backend &&
             sudo systemctl start cometosee'

      - name: Check application status
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/azure_key" \
            "$AZURE_USER@$AZURE_HOST" \
            "sudo systemctl is-active cometosee"
